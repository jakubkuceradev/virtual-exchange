name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            project: exchange
          - name: website-backend
            project: website/backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: website/frontend/.nvmrc
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:mock
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  frontend-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
      - run: uv sync --locked --project ../../exchange
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: website/frontend/.nvmrc
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Check API over HTTP
        run: |
          curl --fail --silent http://127.0.0.1:8000/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/does-not-exist)" = 404
          curl --fail --silent http://127.0.0.1:8001/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/leaderboard)" = 404
      - name: Check website, exchange and backend forwarding
        run: |
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="root"'
          test "$(curl --fail --silent http://127.0.0.1:8080/healthz)" = ok
          # The exchange has no /exchange/* routes, so this proves the prefix is stripped.
          curl --fail --silent http://127.0.0.1:8080/exchange/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/exchange/does-not-exist)" = 404
          # Likewise the backend has no /website/* routes.
          curl --fail --silent http://127.0.0.1:8080/website/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
      - name: Check non-root users, health checks and source labels
        run: |
          for service in api website-backend website; do
            test "$(docker compose exec -T "$service" id -u)" != 0
            image="$(docker compose images --format json "$service" | python3 -c 'import json, sys; i = json.load(sys.stdin)[0]; print(i["ID"])')"
            test "$(docker image inspect --format '{{ if .Config.Healthcheck }}yes{{ end }}' "$image")" = yes
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = https://github.com/jakubkuceradev/virtual-exchange
          done
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
