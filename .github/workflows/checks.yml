name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Check API over HTTP
        run: |
          curl --fail --silent http://127.0.0.1:8000/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/does-not-exist)" = 404
          test "$(docker compose exec -T api id -u)" != 0
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
