name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            project: exchange
          - name: website-backend
            project: website/backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: website/frontend/.nvmrc
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:mock
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  frontend-live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
      - run: uv sync --locked --project ../../exchange
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: website/frontend/.nvmrc
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Check API over HTTP
        run: |
          curl --fail --silent http://127.0.0.1:8000/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/does-not-exist)" = 404
          test "$(docker compose exec -T api id -u)" != 0
          curl --fail --silent http://127.0.0.1:8001/health | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/leaderboard)" = 404
          test "$(docker compose exec -T website-backend id -u)" != 0
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down

  deploy:
    name: deployment topology
    runs-on: ubuntu-latest
    env:
      EXCHANGE_CONFIG_DIR: ${{ github.workspace }}/deploy/examples
      COMPOSE_FILE: deploy/compose.yaml:deploy/compose.build.yaml
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Check website, exchange forwarding and WebSocket heartbeats
        run: uv run --project exchange --locked python deploy/smoke_test.py http://127.0.0.1:8080
      - name: Check isolation and image metadata
        run: |
          for service in exchange website-backend; do
            test -z "$(docker port "$(docker compose ps -q "$service")")"
          done
          for service in exchange website-backend website; do
            test "$(docker compose exec -T "$service" id -u)" != 0
            image="virtual-exchange/$service:local"
            test "$(docker image inspect --format '{{ if .Config.Healthcheck }}yes{{ end }}' "$image")" = yes
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = https://github.com/jakubkuceradev/virtual-exchange
          done
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
