[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "pqc-website-backend"
version = "0.1.0"
description = "Prague Quant Club competition website backend"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = ["fastapi>=0.162.0,<1", "uvicorn>=0.54.0,<1"]

[dependency-groups]
dev = ["httpx2>=2.16.0,<3", "pytest>=9.2.0,<10", "ruff>=0.17.4,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pqc_website"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
