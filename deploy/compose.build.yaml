# Build the deployment topology from source instead of pulling published
# images (local verification and CI):
#   docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml up --build --wait
services:
  exchange:
    image: virtual-exchange/exchange:local
    build: ../exchange
  website-backend:
    image: virtual-exchange/website-backend:local
    build: ../website/backend
  website:
    image: virtual-exchange/website:local
    build: ../website/frontend
