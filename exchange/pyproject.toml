[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "virtual-exchange"
version = "0.1.0"
description = "Prague Quant Club simulated exchange"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "anyio>=4.16.0,<5",
    "fastapi>=0.162.0,<1",
    "uvicorn>=0.54.0,<1",
    "websockets>=15,<20",
]

[dependency-groups]
dev = ["httpx2>=2.16.0,<3", "pytest>=9.2.0,<10", "ruff>=0.17.4,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_exchange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
